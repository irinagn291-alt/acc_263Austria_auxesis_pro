name: Auxesis
options:
  bundleIdPrefix: com.auxesis
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.2'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  Alamofire:
    url: https://github.com/wrandecima-bit/Alamofire
    revision: 7fdd403089757be2ce6991b287c7bef612c8bd04
  AuxCanvasCore:
    path: Packages/AuxCanvasCore
  AuxCanvasStore:
    path: Packages/AuxCanvasStore
  AuxRingKit:
    path: Packages/AuxRingKit
  OneSignal:
    url: https://github.com/OneSignal/OneSignal-XCFramework
    from: 5.5.0
targets:
  Auxesis:
    type: application
    platform: iOS
    sources:
    - path: Auxesis
    resources:
    - path: PrivacyInfo.xcprivacy
    dependencies:
    - package: AuxCanvasCore
      product: AuxCanvasCore
    - package: AuxCanvasStore
      product: AuxCanvasStore
    - package: AuxRingKit
      product: AuxRingKit
    - package: Alamofire
    - package: OneSignal
      product: OneSignalFramework
    - package: OneSignal
      product: OneSignalInAppMessages
    - target: OneSignalNotificationServiceExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.auxesis.ring
        PRODUCT_NAME: Auxesis
        GENERATE_INFOPLIST_FILE: 'YES'
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: 'NO'
        INFOPLIST_KEY_CFBundleDisplayName: Auxesis
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: 'YES'
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: 'YES'
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSCameraUsageDescription: This app does not use the camera.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1,2
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: 'NO'
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: 'NO'
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Support/Auxesis-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/Auxesis.entitlements
  AuxesisTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - path: AuxesisTests
    - path: Packages/AuxCanvasCore/Tests
    - path: Packages/AuxCanvasStore/Tests
    dependencies:
    - target: Auxesis
    - package: AuxCanvasCore
      product: AuxCanvasCore
    - package: AuxCanvasStore
      product: AuxCanvasStore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.auxesis.ring.tests
        GENERATE_INFOPLIST_FILE: 'YES'
        IPHONEOS_DEPLOYMENT_TARGET: '17.0'
        SWIFT_VERSION: '6.2'
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Auxesis.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Auxesis
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
  OneSignalNotificationServiceExtension:
    type: app-extension
    platform: iOS
    sources:
    - path: OneSignalNotificationServiceExtension
    dependencies:
    - package: OneSignal
      product: OneSignalExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.auxesis.ring.OneSignalNotificationServiceExtension
        PRODUCT_NAME: OneSignalNotificationServiceExtension
        GENERATE_INFOPLIST_FILE: 'YES'
        INFOPLIST_FILE: Support/OneSignalNotificationServiceExtension-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: OneSignalNotificationServiceExtension
        CODE_SIGN_ENTITLEMENTS: Support/OneSignalNotificationServiceExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        IPHONEOS_DEPLOYMENT_TARGET: '17.0'
        SWIFT_VERSION: '5.0'
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: 1,2
        SKIP_INSTALL: 'YES'
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
schemes:
  Auxesis:
    build:
      targets:
        Auxesis: all
        AuxesisTests:
        - test
    test:
      targets:
      - AuxesisTests
